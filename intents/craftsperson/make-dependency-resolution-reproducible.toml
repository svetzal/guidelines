id = "guidelines.intent.make-dependency-resolution-reproducible"
title = "Make dependency resolution reproducible"
status = "hypothesized"
confidence = 0.97
capability = "Developers, CI, and deployed artifacts resolve a deliberately equivalent dependency set."
threat = "Floating or independently duplicated version decisions produce environment-specific builds and surprise upgrades."
expectation = "Dependency registries and compatible version ranges will change between installations even when project source does not."
strategy = "Use the ecosystem's appropriate lock or resolution mechanism, centralize version decisions, and verify environments from that source."
evidence = [{ type = "reproducibility_gate", description = "A clean supported environment resolves the committed dependency decision without unexplained drift.", required = true }]
tradeoff = "Locked resolution requires deliberate update work and can delay receiving compatible fixes until the lock is refreshed."
