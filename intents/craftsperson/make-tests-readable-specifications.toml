id = "guidelines.intent.make-tests-readable-specifications"
title = "Make tests readable behavioral specifications"
status = "hypothesized"
confidence = 0.98
capability = "A reader can learn required behavior and diagnose a failure directly from the test suite."
threat = "Opaque names, oversized arrangements, and incidental assertions hide what a test protects."
expectation = "Tests will serve as the most current executable account of behavior for maintainers and agents."
strategy = "Give each test one behavior, intention-revealing names, visible arrange-act-assert flow, and assertions on meaningful outcomes."
evidence = [{ type = "test_review", description = "Each test states one behavior and its failure identifies the violated expectation without reading implementation code.", required = true }]
tradeoff = "More explicit test structure can repeat setup and produce longer suites."
