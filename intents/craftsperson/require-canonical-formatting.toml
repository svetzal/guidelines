id = "guidelines.intent.require-canonical-formatting"
title = "Require canonical formatting"
status = "hypothesized"
confidence = 0.99
capability = "Source changes remain visually consistent and reviews focus on behavior rather than personal formatting choices."
threat = "Formatting drift creates noisy diffs, recurring style debate, and merge friction."
expectation = "Many humans and agents will edit the same source with different local habits."
strategy = "Use the project's canonical automated formatter and treat an unformatted result as incomplete."
evidence = [{ type = "format_gate", description = "The project formatter reports no changes or violations across the completed scope.", required = true }]
tradeoff = "Canonical formatting can produce unrelated churn when configuration or formatter versions change."
