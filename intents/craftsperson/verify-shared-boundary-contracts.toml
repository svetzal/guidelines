id = "guidelines.intent.verify-shared-boundary-contracts"
title = "Verify shared boundary contracts on both sides"
category = "testing"
tags = ["contracts", "compatibility", "boundaries", "cross-repository"]
relations = [
  { type = "related-to", target = "craftsperson/document-public-contracts" },
]
status = "hypothesized"
confidence = 0.98
capability = "Provider and consumer can change independently while preserving their declared compatibility."
threat = "Independent mocks and local tests pass while the two sides assume different interface behavior."
expectation = "Application boundaries will evolve through separate repositories and release versions."
strategy = "Verify both sides against the same versioned executable contract set, covering consumer needs and supported versions in required gates."
evidence = [
  { type = "review", description = "Changed boundaries identify the contract version or hash, provider and consumer commits, and passing verification results for both sides.", required = true },
  { type = "review", description = "Contracts cover relevant errors, optional fields and supported versions; test doubles derive from the verified contracts.", required = true },
]
tradeoff = "Contract maintenance takes work and establishes compatibility only for the declared cases; integration checks still test wiring and user journeys."
