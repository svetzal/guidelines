id = "guidelines.intent.single-source-each-decision"
title = "Single-source each decision"
category = "design"
tags = ["knowledge-duplication", "single-source-of-truth", "maintainability"]
status = "hypothesized"
confidence = 0.99
capability = "A domain or engineering decision can change consistently from one authoritative representation."
threat = "Duplicated knowledge drifts and produces contradictory behavior or configuration."
expectation = "Shared rules, constants, schemas, and policies will evolve over the life of the system."
strategy = "Represent each decision once and derive or delegate all other uses from that source."
evidence = [{ type = "design_review", description = "A change to one decision requires editing one authoritative representation rather than coordinated copies.", required = true }]
tradeoff = "Centralization can create an indirection or dependency that is not worthwhile for coincidentally similar values."
