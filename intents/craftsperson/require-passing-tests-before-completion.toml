id = "guidelines.intent.require-passing-tests-before-completion"
title = "Require passing tests before completion"
status = "hypothesized"
confidence = 0.99
capability = "Completed work preserves all behavior already protected by the project's executable specification."
threat = "Known regressions are normalized, hidden, or deferred while a change is declared complete."
expectation = "Every change can interact with behavior outside its immediate implementation area."
strategy = "Run the complete relevant test suite and resolve every failure before declaring the work complete."
evidence = [{ type = "test_gate", description = "The project's complete relevant test suite passes in the completion environment.", required = true }]
tradeoff = "Full suites consume time and unrelated flaky tests can block otherwise sound changes."
