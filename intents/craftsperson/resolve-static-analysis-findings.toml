id = "guidelines.intent.resolve-static-analysis-findings"
title = "Resolve static-analysis findings"
status = "hypothesized"
confidence = 0.98
capability = "Cheap mechanically detectable defects and policy violations are removed before delivery."
threat = "Warnings accumulate until they hide new defects and normalize bypassing automated feedback."
expectation = "Compilers, linters, and analyzers will detect classes of defects more consistently than manual review."
strategy = "Run the project's configured static analysis, resolve every finding, and document only narrow justified suppressions."
evidence = [{ type = "analysis_gate", description = "Configured analyzers complete without unaddressed findings and each suppression carries a specific rationale.", required = true }]
tradeoff = "Strict analysis can produce false positives and consume time on low-risk style findings."
