sources = [{ type = "document", ref = "plugins/rust-ecosystem/agents/rust-craftsperson.md#optional-but-recommended-for-unsafeffi-or-security-critical-code", summary = "Recommends Miri, sanitizers, and fuzzing for high-risk surfaces.", confidence = 1.0 }]
